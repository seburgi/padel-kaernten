            - pkg: github.com/seburgi/padel-kaernten/services/api/internal/availability
              desc: Slices must not import each other (standards/architecture/slices.md).
            - pkg: github.com/seburgi/padel-kaernten/services/api/internal/games
              desc: Slices must not import each other (standards/architecture/slices.md).
            - pkg: github.com/seburgi/padel-kaernten/services/api/internal/notify
              desc: Slices must not import each other (standards/architecture/slices.md).
            - pkg: github.com/seburgi/padel-kaernten/services/api/internal/transport
              desc: Slices have no HTTP of their own; transport calls them.
        slice-whatsnew:
