openapi: 3.0.3
info:
  title: Padel Kärnten
  version: "1"
  description: >-
    Where in Carinthia a padel court is free (docs/design/). The app's React
    client is its one client; everything sits behind the platform's sign-in
    gateway, and every path but client-config and version needs the
    gateway's note.
servers:
  - url: /
paths:
  /api/v1/client-config:
    get:
      operationId: getClientConfig
      summary: Feature flags for the app
      description: Public, and the deploy's smoke test calls it.
      responses:
        "200":
          description: The flags.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientConfig"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/version:
    get:
      operationId: getVersion
      summary: Which build is running
      description: >-
        Public, so the app can tell a new release and the deploy's smoke
        test can check it runs the commit it deployed.
      responses:
        "200":
          description: The running build.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Version"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/me:
    get:
      operationId: getMe
      summary: Who is signed in, and what they may do
      responses:
        "200":
          description: The signed-in person.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/slots:
    get:
      operationId: getSlots
      summary: The latest free slots
      description: >-
        The snapshot as the booking sites showed it at takenAt. 503 with type
        no-snapshot before the first refresh. Answers 304 to If-None-Match.
      parameters:
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
      responses:
        "200":
          description: The latest snapshot.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Snapshot"
        "304":
          description: The snapshot the client has is the latest.
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/slots/refresh:
    post:
      operationId: refreshSlots
      summary: Ask the booking sites again, at most every five minutes
      description: >-
        When the latest snapshot is older than five minutes, asks every
        booking site again (about ten seconds) and answers the new snapshot;
        otherwise answers the latest without asking (docs/design/slots.md).
        Calls that arrive while one is asking wait for its answer. 502 with
        type sites-failed when every site failed; the last snapshot stays.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: The latest snapshot, fresh or under five minutes old.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Snapshot"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/invitations:
    get:
      operationId: listInvitations
      summary: Who Seb invited
      description: Only the owner (OWNER_EMAIL); anyone else gets 403 with type not-owner.
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: A page of invitations, by email.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationPage"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: invite
      summary: Invite someone
      description: >-
        Only the owner. Puts the person into the Rauthy group padel through
        the platform service, which creates them in Rauthy when it does not
        know them (Rauthy then mails them a link to set a password).
        Inviting someone already invited answers their invitation. 502 with
        type platform-failed when the platform service failed; nothing is
        recorded.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewInvitation"
      responses:
        "201":
          description: Invited.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invitation"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/invitations/{email}:
    parameters:
      - name: email
        in: path
        required: true
        schema:
          type: string
    delete:
      operationId: withdrawInvitation
      summary: Take an invitation back
      description: >-
        Only the owner. Takes the person out of the group padel again, unless
        they were in it before Padel invited them. Safe to repeat.
      responses:
        "204":
          description: Withdrawn.
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/release-notes:
    get:
      operationId: listReleaseNotes
      summary: What's new, and what the caller has read of it
      description: >-
        The notes the API ships, one per change (docs/design/whats-new.md),
        newest day first and, within a day, the one that arrived last
        first. read is the caller's own, on every device. A short list
        that grows by hand, so it is not paged.
      responses:
        "200":
          description: The notes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReleaseNoteList"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/release-notes/read:
    post:
      operationId: markReleaseNotesRead
      summary: Record that the caller has seen these notes
      description: >-
        A slug the API does not ship is left out rather than refused (the
        page may predate a deploy); reading a note twice keeps the first
        time.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReleaseNotesRead"
      responses:
        "204":
          description: Read.
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/groups:
    get:
      operationId: listGroups
      summary: The caller's groups, the ones they are invited into, and the open ones
      description: >-
        What group_visibility shows the caller (docs/design/groups.md): their
        own first, then invitations, then groups that are open or open on
        request, each by name. A short list, so it is not paged.
      responses:
        "200":
          description: The groups.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createGroup
      summary: Found a group, with the caller as its admin
      description: 400 with type invalid-group for an empty or long name or an unknown kind.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewGroup"
      responses:
        "201":
          description: Founded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/groups/{groupId}:
    parameters:
      - $ref: "#/components/parameters/GroupId"
    get:
      operationId: getGroup
      summary: One group, as the caller may see it
      description: >-
        Members always; invitations and requests only for members. 404 with
        type no-group when the group is gone or private to the caller.
      responses:
        "200":
          description: The group.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateGroup
      summary: Rename it or change its kind (admins), or where it plays (any member)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupChange"
      responses:
        "200":
          description: Changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/groups/{groupId}/invitations:
    parameters:
      - $ref: "#/components/parameters/GroupId"
    post:
      operationId: inviteToGroup
      summary: Invite someone into the group; any member may
      description: >-
        The platform service holds the invitation under group-<id>, which
        lets the person into the app (Rauthy mails someone new a link to set
        a password). Inviting someone already invited answers their
        invitation. 409 already-member; 429 invite-limit (20 open, 10 a day
        per person); 502 platform-failed, nothing recorded.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewInvitation"
      responses:
        "201":
          description: Invited.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupInvitation"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/groups/{groupId}/invitations/{email}:
    parameters:
      - $ref: "#/components/parameters/GroupId"
      - name: email
        in: path
        required: true
        schema:
          type: string
    delete:
      operationId: dropGroupInvitation
      summary: Decline an invitation, or take one back
      description: The person invited declines; whoever invited, or an admin, takes it back. Safe to repeat.
      responses:
        "204":
          description: Gone.
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/groups/{groupId}/join:
    parameters:
      - $ref: "#/components/parameters/GroupId"
    post:
      operationId: joinGroup
      summary: Accept an invitation, join an open group, or ask into one open on request
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: What happened.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Joined"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/groups/{groupId}/members/{email}:
    parameters:
      - $ref: "#/components/parameters/GroupId"
      - name: email
        in: path
        required: true
        schema:
          type: string
    put:
      operationId: admitToGroup
      summary: Let someone who asked in; any member may
      description: 404 with type no-request when they did not ask. Safe to repeat.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204":
          description: A member now.
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: removeFromGroup
      summary: Leave, or remove someone (admins)
      description: >-
        When the last admin goes, the member longest in becomes admin; when
        the last member goes, so does the group. Safe to repeat.
      responses:
        "204":
          description: Out.
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/groups/{groupId}/requests/{email}:
    parameters:
      - $ref: "#/components/parameters/GroupId"
      - name: email
        in: path
        required: true
        schema:
          type: string
    delete:
      operationId: dropJoinRequest
      summary: Turn a request down (a member), or take one's own back
      responses:
        "204":
          description: Gone.
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/me/name:
    put:
      operationId: setMyName
      summary: The name the others see
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NameChange"
      responses:
        "200":
          description: The caller, with the name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/me/welcomed:
    post:
      operationId: markWelcomed
      summary: The caller has seen the welcome; doing it twice is the same
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: The caller, welcomed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/availability:
    get:
      operationId: getAvailability
      summary: When the caller can play, their usual weekdays, and where they drive to
      description: >-
        For today in Vienna and the 13 days after it (docs/design/availability.md).
        Only days with spans are listed.
      responses:
        "200":
          description: What the caller said.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Availability"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/availability/days/{day}:
    parameters:
      - name: day
        in: path
        required: true
        schema:
          type: string
          format: date
    put:
      operationId: setAvailabilityDay
      summary: Replace one day
      description: >-
        Spans on a 30-minute grid from 6:00 to 24:00; overlapping or touching
        ones become one. declined with no spans says the day does not suit;
        no spans and not declined leaves the day open. 400 invalid-spans,
        also for spans on a declined day; 400 outside-window for a day
        before today or more than 13 days ahead.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpanList"
      responses:
        "200":
          description: The day's spans as kept.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailabilityDay"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/availability/templates:
    put:
      operationId: setAvailabilityTemplates
      summary: Replace the usual spans per weekday ("wie meistens")
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TemplateList"
      responses:
        "200":
          description: The templates as kept.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateList"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/availability/venues:
    put:
      operationId: setVenues
      summary: Replace the venues the caller drives to; none means every venue
      description: 400 unknown-venue for an id that is not one of the venues.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VenueChoice"
      responses:
        "200":
          description: The venues as kept.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenueChoice"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/groups/{groupId}/fits:
    parameters:
      - $ref: "#/components/parameters/GroupId"
    get:
      operationId: listFits
      summary: Games of four the free courts and the members' times allow
      description: >-
        Computed from the latest snapshot on each call, never stored. Members
        only; 404 no-group otherwise. The snapshot is never refreshed here:
        a schedule does every 30 minutes, and the app asks /slots/refresh. Only the
        courts of the group's area count (halle includes überdacht; a court
        of unknown area counts only for alle).
      parameters:
        - name: minutes
          in: query
          required: true
          schema:
            type: integer
            enum: [60, 90, 120]
      responses:
        "200":
          description: The fits and the near misses.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FitList"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/groups/{groupId}/availability:
    parameters:
      - $ref: "#/components/parameters/GroupId"
    get:
      operationId: getGroupAvailability
      summary: When each member can play, for "Wer kann wann"
      description: >-
        Every member's spans and declined days in the window (today and the
        13 days after it, in Vienna). Members only; 404 no-group otherwise,
        also for an open group someone can see but is not in.
      responses:
        "200":
          description: The window and each member's days.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupAvailability"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/groups/{groupId}/games:
    parameters:
      - $ref: "#/components/parameters/GroupId"
    post:
      operationId: proposeGame
      summary: Propose a fit as a game; whoever proposes plays
      description: 409 with type court-gone when the court is no longer free for the whole game.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewGame"
      responses:
        "201":
          description: The game.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/games:
    get:
      operationId: listGames
      summary: The coming games of the caller's groups, soonest first
      parameters:
        - name: groupId
          in: query
          required: false
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: The games.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameList"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/games/{gameId}:
    parameters:
      - $ref: "#/components/parameters/GameId"
    get:
      operationId: getGame
      summary: One game, for the members of its group
      responses:
        "200":
          description: The game.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateGame
      summary: Mark the game booked, or cancel it; whoever proposed it
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GameChange"
      responses:
        "200":
          description: The game.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/games/{gameId}/players/me:
    parameters:
      - $ref: "#/components/parameters/GameId"
    put:
      operationId: answerGame
      summary: Say yes (in) or no (out); a yes when it is full makes a reserve
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GameAnswer"
      responses:
        "200":
          description: The game.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/push:
    get:
      operationId: getPush
      summary: Whether the API sends notifications, and the key browsers subscribe with
      responses:
        "200":
          description: The VAPID public key, none when push is off.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushInfo"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/push/subscriptions/{subscriptionId}:
    parameters:
      - $ref: "#/components/parameters/SubscriptionId"
    put:
      operationId: subscribePush
      summary: Keep this browser's subscription for the caller, or see it again
      description: >-
        The id is the first 32 hex digits of the endpoint's SHA-256, so a
        browser can name its own. Sent again whenever the app opens; the
        same subscription twice is one.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushSubscription"
      responses:
        "204":
          description: Kept.
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: unsubscribePush
      summary: Forget one of the caller's browsers
      responses:
        "204":
          description: Gone, or was not there.
        default:
          $ref: "#/components/responses/Problem"
components:
  parameters:
    SubscriptionId:
      name: subscriptionId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[0-9a-f]{32}$"
    GameId:
      name: gameId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    GroupId:
      name: groupId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: A UUID the client mints; a retry sends it again (standards/api/idempotency.md).
      schema:
        type: string
        format: uuid
  responses:
    Problem:
      description: An RFC 9457 problem.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    ClientConfig:
      type: object
      required: [features]
      properties:
        features:
          type: object
          additionalProperties:
            type: boolean
    Version:
      type: object
      required: [revision]
      properties:
        revision:
          type: string
          description: The commit the image was built from, or "dev".
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
    Me:
      type: object
      required: [email, canInvite, name, welcomed]
      properties:
        email:
          type: string
        canInvite:
          type: boolean
          description: Sees every invitation into the app (/invites); only the owner.
        name:
          type: string
          description: The name the others see; "" until given.
        welcomed:
          type: boolean
          description: Has seen /welcome; the app shows it until then (docs/design/help.md).
    Snapshot:
      type: object
      required: [takenAt, days, venues]
      properties:
        takenAt:
          type: string
          format: date-time
        days:
          type: array
          description: The calendar days asked for, from today in Vienna.
          items:
            type: string
            format: date
        venues:
          type: array
          items:
            $ref: "#/components/schemas/Venue"
    Venue:
      type: object
      required: [id, name, place, platform, failed, notBookable, step, links, courts]
      properties:
        id:
          type: string
        name:
          type: string
        place:
          type: string
        address:
          type: string
        platform:
          type: string
          description: etennis, wansport, eversports or padelmates; clients tolerate others.
        priceNote:
          type: string
        failed:
          type: boolean
          description: The booking site did not answer as expected; courts is empty.
        notBookable:
          type: array
          description: Days the site does not take bookings for yet.
          items:
            type: string
            format: date
        step:
          type: integer
          description: The grid of start times, in minutes.
        links:
          type: object
          description: The booking page per day (YYYY-MM-DD).
          additionalProperties:
            type: string
        courts:
          type: array
          items:
            $ref: "#/components/schemas/Court"
    Court:
      type: object
      required: [name, free]
      properties:
        name:
          type: string
        area:
          type: string
          description: halle, freiluft or ueberdacht; absent when unknown. Clients tolerate others.
        free:
          type: array
          items:
            $ref: "#/components/schemas/Slot"
    Slot:
      type: object
      required: [day, from, to]
      description: A free stretch on one day, in minutes after midnight in Vienna.
      properties:
        day:
          type: string
          format: date
        from:
          type: integer
        to:
          type: integer
          description: At most 1440.
        pricePerHour:
          $ref: "#/components/schemas/Money"
    Money:
      type: object
      required: [amount, currency]
      properties:
        amount:
          type: integer
          description: Minor units (cents).
        currency:
          type: string
          description: ISO 4217, EUR.
    NewInvitation:
      type: object
      required: [email]
      properties:
        email:
          type: string
          maxLength: 254
    Invitation:
      type: object
      required: [email, invitedAt]
      properties:
        email:
          type: string
        invitedAt:
          type: string
          format: date-time
    InvitationPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Invitation"
        nextCursor:
          type: string
          nullable: true
    ReleaseNote:
      type: object
      description: One change, written for the people who use Padel.
      required: [slug, date, area, title, paragraphs, read]
      properties:
        slug:
          type: string
        date:
          type: string
          format: date
        area:
          type: string
          description: courts, play, invites or app; clients tolerate others.
        title:
          type: string
        paragraphs:
          type: array
          items:
            type: string
        link:
          type: string
          description: A path in the app where the change can be tried.
        read:
          type: boolean
    ReleaseNoteList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ReleaseNote"
    ReleaseNotesRead:
      type: object
      required: [slugs]
      properties:
        slugs:
          type: array
          maxItems: 1000
          items:
            type: string
            maxLength: 200
    GroupKind:
      type: string
      description: private, on_request or open; clients tolerate others.
    GroupArea:
      type: string
      description: >-
        Where a group plays: alle, halle or freiluft; clients tolerate others.
        The fits leave the other courts out; überdacht counts as halle.
    GroupSummary:
      type: object
      required: [id, name, kind, area, how, members, requested]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        kind:
          $ref: "#/components/schemas/GroupKind"
        area:
          $ref: "#/components/schemas/GroupArea"
        how:
          type: string
          description: member, invited or listed (open, not joined); clients tolerate others.
        role:
          type: string
          description: admin or member, for a member.
        members:
          type: integer
        requested:
          type: boolean
          description: The caller asked to join.
    GroupList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/GroupSummary"
    Member:
      type: object
      required: [email, name, role, joinedAt, daysEntered]
      properties:
        email:
          type: string
        name:
          type: string
          description: '"" until they gave one.'
        role:
          type: string
        joinedAt:
          type: string
          format: date-time
        daysEntered:
          type: integer
          description: On how many of the next 14 days they said when they can, or that the day does not suit.
    GroupInvitation:
      type: object
      required: [email, invitedBy, invitedAt]
      properties:
        email:
          type: string
        invitedBy:
          type: string
        invitedAt:
          type: string
          format: date-time
    JoinRequest:
      type: object
      required: [email, name, askedAt]
      properties:
        email:
          type: string
        name:
          type: string
        askedAt:
          type: string
          format: date-time
    Group:
      allOf:
        - $ref: "#/components/schemas/GroupSummary"
        - type: object
          required: [memberList, invitations, requests]
          properties:
            memberList:
              type: array
              items:
                $ref: "#/components/schemas/Member"
            invitations:
              type: array
              description: Only for members.
              items:
                $ref: "#/components/schemas/GroupInvitation"
            requests:
              type: array
              description: Only for members.
              items:
                $ref: "#/components/schemas/JoinRequest"
    NewGroup:
      type: object
      required: [name, kind]
      properties:
        name:
          type: string
          maxLength: 40
        kind:
          $ref: "#/components/schemas/GroupKind"
    GroupChange:
      type: object
      properties:
        name:
          type: string
          maxLength: 40
        kind:
          $ref: "#/components/schemas/GroupKind"
        area:
          $ref: "#/components/schemas/GroupArea"
    Joined:
      type: object
      required: [state]
      properties:
        state:
          type: string
          description: member, or requested for a group open on request.
    NameChange:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 40
    Span:
      type: object
      required: [from, to]
      description: Minutes after midnight in Vienna, on a 30-minute grid from 360 to 1440.
      properties:
        from:
          type: integer
        to:
          type: integer
    SpanList:
      type: object
      required: [spans]
      properties:
        spans:
          type: array
          maxItems: 36
          items:
            $ref: "#/components/schemas/Span"
        declined:
          type: boolean
          default: false
          description: The day does not suit ("passt nicht"); spans must be empty.
    AvailabilityDay:
      type: object
      required: [day, spans, declined]
      properties:
        day:
          type: string
          format: date
        spans:
          type: array
          items:
            $ref: "#/components/schemas/Span"
        declined:
          type: boolean
          description: Said not to suit; such a day has no spans.
    GroupAvailability:
      type: object
      required: [from, to, members]
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        members:
          type: array
          items:
            $ref: "#/components/schemas/MemberAvailability"
    MemberAvailability:
      type: object
      required: [email, name, days]
      properties:
        email:
          type: string
        name:
          type: string
          description: '"" until they gave one.'
        days:
          type: array
          description: Only days with spans or declined, in order; a day left out is open.
          items:
            $ref: "#/components/schemas/AvailabilityDay"
    Template:
      type: object
      required: [weekday, spans]
      properties:
        weekday:
          type: integer
          description: 1 Monday to 7 Sunday.
        spans:
          type: array
          maxItems: 36
          items:
            $ref: "#/components/schemas/Span"
    TemplateList:
      type: object
      required: [templates]
      properties:
        templates:
          type: array
          maxItems: 7
          items:
            $ref: "#/components/schemas/Template"
    VenueChoice:
      type: object
      required: [venues]
      properties:
        venues:
          type: array
          maxItems: 50
          items:
            type: string
    Availability:
      type: object
      required: [from, to, days, templates, venues]
      properties:
        from:
          type: string
          format: date
          description: Today in Vienna.
        to:
          type: string
          format: date
          description: The last day one can enter.
        days:
          type: array
          items:
            $ref: "#/components/schemas/AvailabilityDay"
        templates:
          type: array
          items:
            $ref: "#/components/schemas/Template"
        venues:
          type: array
          items:
            type: string
    Fit:
      type: object
      required: [day, start, minutes, venueId, venueName, court, can, ask]
      properties:
        day:
          type: string
          format: date
        start:
          type: integer
          description: Minutes after midnight in Vienna.
        minutes:
          type: integer
        venueId:
          type: string
        venueName:
          type: string
        court:
          type: string
        price:
          $ref: "#/components/schemas/Money"
        perHead:
          $ref: "#/components/schemas/Money"
        link:
          type: string
          description: The venue's booking page for the day.
        can:
          type: array
          description: The members free for the whole game, in the group's order.
          items:
            $ref: "#/components/schemas/Person"
        ask:
          type: array
          description: On a near miss, members who entered nothing for the day, not even that it does not suit.
          items:
            $ref: "#/components/schemas/Person"
    Person:
      type: object
      required: [email, name]
      properties:
        email:
          type: string
        name:
          type: string
          description: '"" until they gave one.'
    FitList:
      type: object
      required: [takenAt, need, fits, nearly]
      properties:
        takenAt:
          type: string
          format: date-time
          description: When the snapshot the fits come from was taken.
        need:
          type: integer
          description: How many play a game.
        fits:
          type: array
          items:
            $ref: "#/components/schemas/Fit"
        nearly:
          type: array
          description: One short; ask lists who could still make it.
          items:
            $ref: "#/components/schemas/Fit"
    NewGame:
      type: object
      required: [venueId, court, day, start, minutes]
      properties:
        venueId:
          type: string
        court:
          type: string
        day:
          type: string
          format: date
        start:
          type: integer
        minutes:
          type: integer
    Player:
      type: object
      required: [email, name, state]
      properties:
        email:
          type: string
        name:
          type: string
        state:
          type: string
          description: in, reserve or out; clients tolerate others.
    Game:
      type: object
      required: [id, groupId, groupName, venueId, venueName, court, day, start, minutes, players, state, proposedBy, lineup]
      properties:
        id:
          type: integer
          format: int64
        groupId:
          type: integer
          format: int64
        groupName:
          type: string
        venueId:
          type: string
        venueName:
          type: string
        court:
          type: string
        day:
          type: string
          format: date
        start:
          type: integer
        minutes:
          type: integer
        players:
          type: integer
          description: How many play; 4 today.
        price:
          $ref: "#/components/schemas/Money"
        perHead:
          $ref: "#/components/schemas/Money"
        link:
          type: string
          description: The venue's booking page for the day, while the snapshot has one.
        state:
          type: string
          description: proposed, booked or cancelled; clients tolerate others.
        proposedBy:
          $ref: "#/components/schemas/Person"
        lineup:
          type: array
          description: Every answer, in the order given.
          items:
            $ref: "#/components/schemas/Player"
    GameList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Game"
    GameChange:
      type: object
      required: [state]
      properties:
        state:
          type: string
          description: booked or cancelled.
    PushInfo:
      type: object
      properties:
        publicKey:
          type: string
          description: The VAPID public key, base64url; absent when push is off.
    PushSubscription:
      type: object
      required: [endpoint, keys]
      properties:
        endpoint:
          type: string
        keys:
          type: object
          required: [p256dh, auth]
          properties:
            p256dh:
              type: string
            auth:
              type: string
    GameAnswer:
      type: object
      required: [answer]
      properties:
        answer:
          type: string
          description: in or out.
